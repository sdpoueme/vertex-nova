# Vertex Nova — Model Routing

routes:
  - name: vision
    patterns:
      - "\\[image\\]"
      - "photo"
      - "image"
      - "que vois"
    model: gemma4:e2b

  - name: news
    patterns:
      - "actualites"
      - "nouvelles"
      - "news"
      - "briefing"
      - "journal"
    model: qwen3:8b

default:
  model: qwen3:8b

# Model roles:
# qwen3:8b — general chat, tool use, French (primary)
# phi4-mini — proactive routines, strict instruction following, SKIP logic
# nemotron-mini — fast responses, simple tasks, summaries
# gemma4:e2b — vision/image analysis
